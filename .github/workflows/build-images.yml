name: Build and Push OS Images

on:
  push:
    branches:
      - main
    paths:
      - 'base/**'
      - 'k3s/**'
      - 'kubevirt/**'
      - 'desktops/**'
      - 'niri-kubevirt/**'
      - 'agent-runtime/**'
      - '.github/workflows/**'
  schedule:
    # Cron job to rebuild the whole image family every Sunday at 00:00 for
    # the newest security updates.
    - cron: '0 0 * * 0'
  workflow_dispatch: # in order to be able to manually initiate the action

# Sets the permission ceiling for every job below, including the reusable
# build-image.yml calls — without this, GITHUB_TOKEN defaults to read-only
# on packages and build-image.yml's own `packages: write` request is
# rejected as exceeding what the caller is allowed to grant.
permissions:
  contents: read
  packages: write

# Every job runs on every trigger, in dependency order (base first, then
# whatever FROMs it). This guarantees a flavor image is never built against
# a stale published parent image, at the cost of always rebuilding all
# images together — acceptable at this repo's size, and cache-from/cache-to
# (see build-image.yml) keeps unchanged layers cheap.
#
#   base ──┬─→ k3s ──┬─→ kubevirt ─→ niri-kubevirt
#          │         └─→ agent-runtime
#          ├─→ desktops/sway
#          ├─→ desktops/cosmic
#          └─→ desktops/niri
jobs:
  base:
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: base
      containerfile: base/Containerfile

  k3s:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: k3s
      containerfile: k3s/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/base:sha-${{ needs.base.outputs.short_sha }}

  kubevirt:
    needs: k3s
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: kubevirt
      containerfile: kubevirt/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/k3s:sha-${{ needs.k3s.outputs.short_sha }}

  agent-runtime:
    needs: k3s
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: agent-runtime
      containerfile: agent-runtime/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/k3s:sha-${{ needs.k3s.outputs.short_sha }}

  sway:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: sway
      containerfile: desktops/sway/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/base:sha-${{ needs.base.outputs.short_sha }}

  cosmic:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: cosmic
      containerfile: desktops/cosmic/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/base:sha-${{ needs.base.outputs.short_sha }}

  niri:
    needs: base
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: niri
      containerfile: desktops/niri/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/base:sha-${{ needs.base.outputs.short_sha }}

  niri-kubevirt:
    needs: kubevirt
    uses: ./.github/workflows/build-image.yml
    with:
      flavor: niri-kubevirt
      containerfile: niri-kubevirt/Containerfile
      build_args: BASE_IMAGE=ghcr.io/${{ github.repository }}/kubevirt:sha-${{ needs.kubevirt.outputs.short_sha }}
